# @package _global_
# =============================================================================
# Continual Learning — AC-HOPE-Hybrid Phase 8 + Filmstrip Visualization
# =============================================================================
# IDENTICAL to cl_ac_hope_phase8_hybrid.yaml — same architecture, same
# hyperparameters, same CL pipeline.  Only difference: run via
# cl_train_filmstrip.py to generate PCA→RGB latent-space filmstrips after
# base training and after every sequential task.
#
# Usage:
#   uv run src/cl_train_filmstrip.py experiment=cl_ac_hope_phase8_hybrid_filmstrip \
#       paths.data_dir=/path/to/clips
# =============================================================================

defaults:
  - override /data_settings@data: precomputed_features
  - override /model: ac_hope_hybrid_vit
  - override /trainer: default
  - override /callbacks: default
  - override /logger: wandb

# =============================================================================
# EXPERIMENT METADATA
# =============================================================================
task_name: "cl_ac_hope_phase8_filmstrip"
tags: ["cl", "continual_learning", "ac_hope_hybrid", "attention", "titan",
       "cms", "phase8", "rope", "longterm_memory", "filmstrip"]
seed: 42
train: True
test: False

# =============================================================================
# DATA DEFAULTS (overridden per phase by cl_train.py)
# =============================================================================
data:
  batch_size: 16
  num_workers: 4
  pin_memory: true

# =============================================================================
# MODEL: AC-HOPE-Hybrid-ViT Phase 8 (depth=10, ~47M params)
# =============================================================================
model:
  T_teacher: 7
  jump_k: 3
  use_activation_checkpointing: false
  action_embed_dim: 2

  # ─── Hybrid architecture ───
  depth: 10
  num_heads: 16

  # Titan memory (compact: augments attention, doesn't replace it)
  titan_hidden_multiplier: 2
  titan_layers: 2
  titan_activation: "gelu"
  titan_grad_clip_inner: 1.0
  titan_grad_clip_backward: 1.0
  titan_detach_interval: 2
  surprise_threshold: 0.1

  # Longterm memory for cross-clip CL
  use_longterm_memory: true
  longterm_hidden_multiplier: 2
  longterm_lr_scale: 0.1

  # CMS — heterogeneous multi-frequency
  cms_use_chunk_scheduling: true
  cms_level_specs:
    - name: "fast"
      update_period: 1
      hidden_multiplier: 2.0
      warmup_steps: 0
    - name: "medium"
      update_period: 3
      hidden_multiplier: 2.5
      warmup_steps: 0
    - name: "slow"
      update_period: 7
      hidden_multiplier: 3.0
      warmup_steps: 0

  # Attention settings
  qkv_bias: true
  attn_drop_rate: 0.0

  # Diagnostics
  log_hope_diagnostics: true
  diagnostics_log_interval: 50

  # Loss
  loss_weight_teacher: 1.0
  loss_weight_jump: 1.0
  loss_type: "l1"

  # Curriculum — mild schedule
  curriculum_schedule:
    - epoch: 0
      loss_weight_teacher: 1.0
    - epoch: 15
      loss_weight_teacher: 1.0
    - epoch: 25
      loss_weight_teacher: 1.0

  # Regularization
  drop_rate: 0.0
  drop_path_rate: 0.1

  # Optimizer — AdamW
  optimizer_type: "adamw"
  learning_rate: 4.25e-4
  weight_decay: 0.04
  betas: [0.9, 0.999]

  # Per-group LR scaling
  attention_lr_scale: 1.0
  titan_lr_scale: 0.1
  cms_lr_scale: 0.6
  titan_weight_decay: 0.005
  aux_loss_weight: 0.0

  # LR schedule — iteration-based
  use_iteration_scheduler: true
  warmup_pct: 0.10
  constant_pct: 0.80
  decay_pct: 0.10
  warmup_start_lr: 7.5e-5

  # TTA defaults
  tta_enabled: false

# =============================================================================
# TRAINER DEFAULTS
# =============================================================================
trainer:
  max_epochs: 40
  precision: "16-mixed"
  gradient_clip_val: 1.5
  gradient_clip_algorithm: norm
  accumulate_grad_batches: 1

# =============================================================================
# CONTINUAL LEARNING PIPELINE CONFIGURATION
# =============================================================================
cl:
  wandb_group: "cl_ac_hope_phase8_filmstrip_${now:%Y%m%d_%H%M%S}"
  task_training_mode: "finetune"
  resume_from_base_checkpoint: null

  base_training:
    clip_start: 0
    clip_end: 5000
    max_epochs: 40
    val_split: 0.1

  tasks:
    - name: "scaling_shift"
      clip_start: 5000
      clip_end: 6000
    - name: "dissipation_shift"
      clip_start: 6000
      clip_end: 7000
    - name: "discretization_shift"
      clip_start: 7000
      clip_end: 8000
    - name: "kinematics_shift"
      clip_start: 8000
      clip_end: 9000
    - name: "compositional_ood"
      clip_start: 9000
      clip_end: 10000

  eval:
    clips_per_task: 100

  task_training:
    max_epochs: 10
    val_split: 0.0
    learning_rate: 1.4e-4
    warmup_pct: 0.05
    warmup_start_lr: 2.5e-5

  # ─── Filmstrip visualization settings ───
  filmstrip:
    upsample_size: 128
    pca_max_clips: 10
